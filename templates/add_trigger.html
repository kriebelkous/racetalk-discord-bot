<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Trigger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        function toggleRegexFields() {
            const isRegex = document.getElementById('is_regex').checked;
            document.getElementById('condition').disabled = isRegex;
        }

        function addField(containerId) {
            const container = document.getElementById(containerId);
            const input = document.createElement('input');
            input.type = 'text';
            input.name = containerId === 'trigger_words_container' ? 'trigger_words' : 'responses';
            input.className = 'w-full p-2 mb-2 border rounded';
            input.required = true;
            container.appendChild(input);
        }

        function addUserOverride() {
            const container = document.getElementById('user_overrides_container');
            const div = document.createElement('div');
            div.className = 'flex mb-2';
            div.innerHTML = `
                <select name="user_override_ids" class="w-1/2 p-2 border rounded mr-2" required>
                    <option value="">Select User</option>
                    {% for u in users %}
                        <option value="{{ u.user_id }}">{{ u.username or u.user_id }}</option>
                    {% endfor %}
                </select>
                <input type="text" name="user_override_responses" class="w-1/2 p-2 border rounded" placeholder="Override response" required>
                <button type="button" onclick="this.parentNode.remove()" class="ml-2 text-red-500 hover:underline">Remove</button>
            `;
            container.appendChild(div);
        }
    </script>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto p-4">
        <h1 class="text-2xl font-bold mb-4">Add New Trigger</h1>
        <a href="{{ url_for('dashboard') }}" class="text-blue-500 hover:underline mb-4 inline-block">Back to Dashboard</a>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="mb-4 p-4 {% if category == 'error' %}bg-red-100 text-red-700{% else %}bg-green-100 text-green-700{% endif %} rounded">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <form method="POST" class="bg-white p-6 rounded shadow">
            <div class="mb-4">
                <label class="block mb-1">Use Regex</label>
                <input type="checkbox" id="is_regex" name="is_regex" value="true" onchange="toggleRegexFields()">
            </div>
            <div class="mb-4">
                <label class="block mb-1">Trigger Condition (Non-Regex)</label>
                <select id="condition" name="condition" class="w-full p-2 border rounded">
                    <option value="anywhere">Anywhere in sentence</option>
                    <option value="beginning">Beginning of sentence</option>
                    <option value="end">End of sentence</option>
                </select>
            </div>
            <div class="mb-4">
                <label class="block mb-1">Match Type</label>
                <select name="match" class="w-full p-2 border rounded">
                    <option value="both">Both (any occurrence)</option>
                    <option value="sentence">Sentence (word in sentence)</option>
                    <option value="word">Word (exact match)</option>
                </select>
            </div>
            <div class="mb-4">
                <label class="block mb-1">Trigger Words</label>
                <div id="trigger_words_container">
                    <input type="text" name="trigger_words" class="w-full p-2 mb-2 border rounded" required>
                </div>
                <button type="button" onclick="addField('trigger_words_container')" class="text-blue-500 hover:underline">Add Another Word</button>
            </div>
            <div class="mb-4">
                <label class="block mb-1">Responses</label>
                <div id="responses_container">
                    <input type="text" name="responses" class="w-full p-2 mb-2 border rounded" required>
                </div>
                <button type="button" onclick="addField('responses_container')" class="text-blue-500 hover:underline">Add Another Response</button>
            </div>
            <div class="mb-4">
                <label class="block mb-1">User Overrides</label>
                <div id="user_overrides_container"></div>
                <button type="button" onclick="addUserOverride()" class="text-blue-500 hover:underline">Add User Override</button>
            </div>
            <div class="mb-4">
                <label class="block mb-1">Response Method</label>
                <select name="method" class="w-full p-2 border rounded">
                    <option value="random">Random</option>
                    <option value="sequential">Sequential</option>
                </select>
            </div>
            <div class="mb-4">
                <label class="block mb-1">Enabled</label>
                <input type="checkbox" name="enabled" value="true" checked>
            </div>
            <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Create Trigger</button>
        </form>
    </div>
</body>
</html>

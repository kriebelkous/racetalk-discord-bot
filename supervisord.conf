[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
user=appuser

[program:flask_app]
directory=/app
command=/usr/local/bin/python app.py
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=10
killasgroup=true
stopasgroup=true
environment=ENV="production"
stdout_logfile=/tmp/flask_app.log
stderr_logfile=/tmp/flask_app_err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

[program:bot]
directory=/app
command=/usr/local/bin/python bot.py
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=10
killasgroup=true
stopasgroup=true
environment=ENV="production"
stdout_logfile=/tmp/bot.log
stderr_logfile=/tmp/bot_err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
user=appuser

[program:flask_app]
directory=/app
command=/usr/local/bin/python app.py
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=10
killasgroup=true
stopasgroup=true
environment=ENV="production"
stdout_logfile=/var/log/flask_app.log
stderr_logfile=/var/log/flask_app_err.log

[program:bot]
directory=/app
command=/usr/local/bin/python bot.py
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=10
killasgroup=true
stopasgroup=true
environment=ENV="production"
stdout_logfile=/var/log/bot.log
stderr_logfile=/var/log/bot_err.log